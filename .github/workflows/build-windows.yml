name: Build Windows Installer

on:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download portable Python 3.12.13
        run: |
          $url = "https://github.com/astral-sh/python-build-standalone/releases/download/20260510/cpython-3.12.13+20260510-x86_64-pc-windows-msvc-install_only.tar.gz"
          Write-Host "Downloading portable Python..."
          Invoke-WebRequest -Uri $url -OutFile python.tar.gz
          tar -xzf python.tar.gz
          Move-Item -Path python -Destination electron/python

      - name: Install Python dependencies
        run: |
          $python = "electron/python/python.exe"
          Write-Host "Bootstrapping pip..."
          & $python -m pip install --upgrade pip
          Write-Host "Installing requirements..."
          & $python -m pip install -r requirements.txt

      - name: Cleanup Python runtime
        run: node electron/cleanup-python.js

      - name: Install npm dependencies
        run: npm install
        working-directory: electron

      - name: Build NSIS installer
        run: npx electron-builder --win
        working-directory: electron

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SampleForge-Setup
          path: electron/dist/SampleForge Setup *.exe
          retention-days: 30
