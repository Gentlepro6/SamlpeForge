<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SampleForge Launcher</title>
<style>
  :root {
    --bg: #141414;
    --text: #999999;
    --text-secondary: #555555;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; align-items: center; justify-content: center;
    height: 100vh; overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }
  .container { text-align: center; }
  .logo {
    font-size: 28px; font-weight: 300;
    letter-spacing: 0.15em;
    color: var(--text);
    margin-bottom: 12px;
  }
  .spinner {
    width: 32px; height: 32px;
    border: 2px solid var(--text-secondary);
    border-top-color: var(--text);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status {
    font-size: 13px;
    color: var(--text-secondary);
  }
</style>
</head>
<body>
<div class="container">
  <div class="logo">SAMPLEFORGE</div>
  <div class="spinner"></div>
  <div class="status" id="status">Starting Python engine&hellip;</div>
</div>
<script>
  const statusEl = document.getElementById("status");
  if (window.sampleforge) {
    window.sampleforge.onPythonReady(() => {
      statusEl.textContent = "Engine ready — launching application";
    });
    window.sampleforge.onPythonError((msg) => {
      statusEl.textContent = "Error: " + msg;
    });
    window.sampleforge.onPythonExit((code) => {
      statusEl.textContent = "Engine stopped (exit " + code + ")";
    });
  } else {
    statusEl.textContent = "Starting SampleForge...";
  }
</script>
</body>
</html>
